name: Build, Scan and Publish Docker image

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ue19-1ab-05
  FULL_IMAGE: ghcr.io/chevalshp/ue19-1ab-05:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # 📥 1. Récupérer le code du repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔐 2. Se connecter au registre GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🛠️ 3. Build de l’image (sans push)
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.FULL_IMAGE }}

      # 🔎 4. Scan de l’image avec Trivy
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.FULL_IMAGE }}
          format: 'table'
          exit-code: '1'              # Échec si vulnérabilités HIGH/CRITICAL
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 🚀 5. Push de l’image (si le scan est OK)
      - name: Push Docker image
        if: success()
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.FULL_IMAGE }}
